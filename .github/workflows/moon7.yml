#
# Уровень 7 высот Луны отдельно: в общей задаче tiles.yml на машине не
# хватило места - сетка LOLA 8 ГБ рядом с тайлами Марса. Здесь из
# хранилища берутся только скрипты, место освобождается от
# предустановленных пакетов, тайлы уходят двумя частями. Запуск вручную
# или правкой этой задачи.

name: Высоты Луны, уровень 7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/moon7.yml

permissions:
  contents: write

concurrency:
  group: tiles
  cancel-in-progress: false

jobs:
  moon7:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Место
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            .github

      - name: GDAL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdal-bin python3-gdal python3-numpy python3-pil

      - name: Нарезать и отправить
        run: |
          git config user.name "planetx-bodies"
          git config user.email "planetx-bodies@users.noreply.github.com"
          agent="PlanetX-bodies tiles (+https://github.com/Valery35/planetx-bodies-terrain)"
          curl -fsSL --retry 3 --retry-delay 30 -A "$agent" -o grid.tif "https://planetarymaps.usgs.gov/mosaic/Lunar_LRO_LOLA_Global_LDEM_118m_Mar2014.tif"
          python3 scripts/tiles.py check grid.tif 5.41 -158.63 9000 11500 "Moon summit"
          python3 scripts/tiles.py grid.tif out 7 7
          rm -f grid.tif
          df -h /
          git sparse-checkout disable || true
          git sparse-checkout set --no-cone scripts .github moon/7
          mkdir -p moon/7
          for part in 0 1; do
            for x in $(seq $(( part * 64 )) $(( part * 64 + 63 ))); do
              if [ -d "out/7/$x" ]; then mv "out/7/$x" moon/7/; fi
            done
            git add --sparse moon/7
            git commit -q -m "moon: высоты, уровень 7, часть $(( part + 1 )) из 2"
            git push -q origin HEAD:main
          done
          du -sh moon/7